name: Render gallery
on:
  workflow_dispatch:
  push:
    branches: [Kevin0412-patch-1]
    paths:
      - 'Mandelbrot_python.c'
      - 'scripts/render_gallery.py'
      - '.github/workflows/render-gallery.yml'
permissions:
  contents: write
concurrency:
  group: render-gallery
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install Pillow==11.3.0
          git clone --depth 1 https://github.com/miloyip/svpng.git svpng
          python scripts/render_gallery.py
      - uses: actions/upload-artifact@v4
        with:
          name: mandelbrot-gallery
          path: |
            render-output/
            docs/generated/
          if-no-files-found: error
          retention-days: 14
      - name: Publish compact preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/generated/gallery.webp
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh rendered gallery'
            git push origin HEAD
          fi
